map $http_upgrade $backup_mgr_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name backup.electropool.online;              # replace with your domain if you have one

    client_max_body_size 8m;

    # Cloudflare proxies this host, so the peer address is Cloudflare's, not the
    # visitor's. Trusting only Cloudflare's ranges means a direct connection
    # cannot forge CF-Connecting-IP, while the panel's audit log, sign-in and
    # sudo throttling all see the real client address.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: the panel trusts the first
        # entry, and with real-IP applied this is the verified client address. An
        # incoming header from a direct connection is discarded rather than echoed.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $backup_mgr_connection_upgrade;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/backup.electropool.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/backup.electropool.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}



server {
    if ($host = backup.electropool.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name backup.electropool.online;
    return 404; # managed by Certbot


}
