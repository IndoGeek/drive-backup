[package]
name = "backup-mgr"
version = "1.6.0"
edition = "2021"
description = "Pterodactyl / generic directory backup manager with Google Drive sync via rclone"
license = "MIT"

[[bin]]
name = "backup-mgr"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
http = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
