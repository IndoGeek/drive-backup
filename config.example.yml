# =============================================================================
# backup-mgr configuration  (EXAMPLE - copy to config.yml and edit)
#   cp config.example.yml config.yml && nano config.yml
# =============================================================================
#  * "CRITICAL" options can break backups / recovery if changed carelessly.
#  * After editing config.yml, restart:  pm2 restart backup-mgr
#  * Relative paths resolve against the config file's directory.
# =============================================================================

# =============================================================================
#  1. GENERAL
# =============================================================================
timezone: "UTC"

run:
  # true  -> keep taking scheduled backups after a failure
  # false -> pause until "backup-mgr reset" is run
  continue_after_manual_resume: false
  check_state_seconds: 30

# =============================================================================
#  2. BACKUP
# =============================================================================
backup:
  # CRITICAL - archive name prefix (local + remote + retention). Change only
  # before the first run; old archives with a different prefix are never pruned.
  prefix: "backup"

  # CRITICAL - the folder to archive.
  path: "/path/to/your/data"

  # Local staging dir where archives are created before upload.
  dir: "./backup"

  # Compression. Empty = "tar.gz". Supported: tar | tar.gz | tar.zst | tar.xz | tar.bz2 | zip
  compression: "tar.gz"

  # First daily backup (24h HH:MM) + runs per day (1 = once/day, N = N even runs).
  time: "03:30"
  backups_per_day: 1

  # Exact daily run times (24h HH:MM). Empty = use time + backups_per_day above.
  # Set these to run at specific times instead of at even intervals:
  #   times: ["03:30", "15:30"]     # two backups a day, exactly then
  #   times: ["00:00", "06:00", "12:00", "18:00"]
  # When set, these are the schedule: time/backups_per_day are ignored.
  times: []

  # CRITICAL - timestamp tokens in archive names. Retention keeps the newest N
  # backups regardless of compression, so changing this only changes the name shape.
  timestamp_format: "%d-%m-%y_%H-%M"

  # How many most-recent archives stay on this server. Keep 1 = the newest
  # backup stays and every older one is pruned after a successful run.
  # Counted by archive name prefix, so switching compression still prunes to this number.
  max_local_backups: 1

  # CRITICAL - glob patterns excluded from the archive (tar --exclude, relative to backup root).
  exclude_patterns:
    - "*.zip"

  # If a scheduled slot was missed while down, run on startup (within window).
  catch_up_on_start: true
  catch_up_window_minutes: 120

  # Disk-space preflight: require free disk >= estimated_size * slack + min_free_disk_gb.
  min_free_disk_gb: 5
  preflight_slack_factor: 1.1

# World-only snapshots (Minecraft only): frequent small backups of just the world.
world_backup:
  enabled: false
  minecraft_only: true
  world_folder: "world"         # sub-folder of backup.path
  prefix: "mcworld"
  times:                        # empty = disabled; HH:MM run times
    - "06:00"
    - "12:00"
    - "18:00"

# =============================================================================
#  3. STORAGE (remote destinations)
# =============================================================================
google_drive:                   # PRIMARY remote
  # CRITICAL - rclone remote name (create with "backup-mgr remote-auth").
  remote: "gdrive"
  # CRITICAL - destination folder on Google Drive.
  dir: "my-backups"
  retention: 2                  # backups kept on the primary remote

  # Optional OAuth client id/secret (Google Cloud). Blank = browser auth.
  client_id: ""
  client_secret: ""
  scope: "drive"
  token_uri: "https://oauth2.googleapis.com/token"

  # Pre-issued tokens (rclone refreshes automatically on expiry).
  refresh_token: ""
  access_token: ""
  expiry: ""

storage:
  # false -> try primary; on failure fall back to secondary
  # true  -> upload to EVERY enabled remote; any failure aborts the run
  upload_to_all: false
  secondary:                    # optional second copy target (e.g. B2)
    enabled: false
    remote: "b2"
    dir: "backup"
    retention: 3
    client_id: ""
    client_secret: ""
    refresh_token: ""
    access_token: ""
    expiry: ""

# =============================================================================
#  4. ENCRYPTION
# =============================================================================
encrypt:                        # gpg -c, symmetric AES256
  enabled: false
  # CRITICAL - if enabled, keep this safe. Lose/change it and existing
  # archives can never be decrypted. Stored plaintext here, never on remotes.
  passphrase: ""
  cipher: "AES256"

# =============================================================================
#  5. NOTIFICATIONS
# =============================================================================
notifications:
  # Discord webhook URL. Empty = disabled. Sent for backup success/failure,
  # restore done, preflight fail, manual-resume and integrity checks.
  discord_webhook: ""

# =============================================================================
#  6. MONITORING
# =============================================================================
metrics:
  # Prometheus-style metrics endpoint. Try: curl http://127.0.0.1:9101/metrics
  enabled: true
  host: "127.0.0.1"
  port: 9101

# =============================================================================
#  7. INTERNAL DATA (logging / state / history)
# =============================================================================
logging:
  dir: "./logs"
  level: "info"                 # debug | info | warn | error
  keep_days: 30

state:
  # CRITICAL - JSON tracking last run / failure status.
  file: "./state.json"

database:
  # CRITICAL - SQLite history + remote hash manifest (used by "backup-mgr check").
  # Changing the path orphans the old history.
  file: "./history.db"

# =============================================================================
#  8. PTERODACTYL INTEGRATION  ⚠️ DEV — DO NOT ENABLE
# =============================================================================
# The save-all / stop / start websocket flow is NOT working yet. Leave
# enabled: false; backups then run normally without touching the server.
pterodactyl:
  enabled: false                 # ⚠️ leave false until the ptero flow is fixed
  panel_url: "https://panel.example.com"
  api_key: ""                    # CLIENT API key ("ptlc_", NOT "ptla_")
  server_id: ""                  # server UUID shown in the panel URL
  pre_backup_command: "save-all" # console command to flush world to disk
  pre_backup_delay_seconds: 10   # pause after command, before stopping

  # Stop the server before archiving. "stop" = graceful (safest) | "kill" = force.
  shutdown_server: false
  shutdown_signal: "stop"
  stop_timeout_seconds: 180      # max wait for server to go offline

  # Restart the server after the backup finishes.
  start_server_after: true
  start_timeout_seconds: 90      # max wait for server to report "running"

  # false = warn and continue (archive still happens);
  # true  = abort the run on any failure.
  fail_on_error: false