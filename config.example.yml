# =============================================================================
# backup-mgr configuration  (EXAMPLE - copy to config.yml and edit)
#
#   cp config.example.yml config.yml && nano config.yml
#
# !!! CRITICAL OPTIONS !!! Options marked with "CRITICAL" can break backups /
# recovery if changed carelessly. Read the inline warnings before touching them.
# All other options are safe to tune at any time.
#
# After editing config.yml, restart the process to load the new settings:
#   pm2 restart backup-mgr        (systemd: systemctl restart backup-mgr)
# Relative paths are resolved against this file's directory.
# =============================================================================

backup:
  # CRITICAL - archive file-name prefix everywhere (local + remote + retention).
  # Only change before the first run; old archives stop being pruned afterwards.
  prefix: "mc"

  # CRITICAL - the folder that gets archived. Everything inside is included
  # (unless excluded below).
  path: "/var/lib/pterodactyl/volumes/<SERVER-UUID>"

  # Local staging directory where archives are created before upload.
  dir: "./backup"

  # Compression. Empty defaults to "tar.gz".
  # Supported: tar | tar.gz | tar.zst | tar.xz | tar.bz2 | zip
  compression: "tar.gz"

  # Time of the first daily backup (24h, HH:MM) in the configured timezone.
  time: "03:30"

  # How many backups to run per day. 1 = once/day. N = N evenly spaced runs/day.
  backups_per_day: 1

  # CRITICAL - timestamp tokens used in archive names. Changing this breaks
  # retention pruning of old archives.
  timestamp_format: "%d-%m-%y_%H-%M"

  # Keep at most this many archives in the local staging dir before upload/prune.
  max_local_backups: 1

  # CRITICAL - glob patterns excluded from the archive (tar --exclude semantics).
  exclude_patterns:
    - "*.zip"

  # Run on startup if a scheduled slot was missed within this window.
  catch_up_on_start: true
  catch_up_window_minutes: 120

  # ---- Disk-space preflight ----
  min_free_disk_gb: 5
  preflight_slack_factor: 1.1

# ---- World-only backups (MINECRAFT SERVER ONLY) ----
world_backup:
  enabled: false                # enable for minecraft servers
  minecraft_only: true
  world_folder: "world"         # sub-folder inside backup.path
  prefix: "mcworld"
  times:                        # empty list = disabled; HH:MM run times
    - "06:00"
    - "12:00"
    - "18:00"

# ---- Encrypted archives (gpg -c, symmetric AES256) ----
encrypt:
  enabled: false
  # CRITICAL - if enabled, this MUST be set and kept safe. Lose/change it and
  # existing encrypted archives can never be decrypted again. Stored in plain
  # text inside this (root-only) file, never copied to remote remotes.
  passphrase: ""
  cipher: "AES256"

logging:
  dir: "./logs"
  level: "info"                 # debug | info | warn | error
  keep_days: 30

state:
  file: "./state.json"          # CRITICAL - run-state / failure flag tracking

google_drive:
  # CRITICAL - PRIMARY rclone remote name (create with "backup-mgr remote-auth").
  remote: "gdrive"
  # CRITICAL - folder on Google Drive where backups are stored.
  dir: "mc-backup"
  retention: 3

  # Optional OAuth client id/secret (Google Cloud OAuth client).
  client_id: ""
  client_secret: ""
  scope: "https://www.googleapis.com/auth/drive"
  token_uri: "https://oauth2.googleapis.com/token"

  # Optional pre-issued tokens.
  refresh_token: ""
  access_token: ""
  expiry: ""

storage:
  # false -> primary only; if it fails, fall back to secondary. (Swap the two
  #          sections to "or vice versa".)
  # true  -> upload to EVERY enabled remote; any failure aborts.
  upload_to_all: false
  secondary:
    # CRITICAL - when enabled this is a full second copy target (e.g. B2).
    enabled: false
    remote: "b2"
    dir: "backup"
    retention: 3
    client_id: ""
    client_secret: ""
    refresh_token: ""
    access_token: ""
    expiry: ""

notifications:
  # Discord webhook URL. Empty = disabled. When set, embedded messages are sent
  # for backup success/failure, restore done, preflight fail, manual-resume and
  # integrity checks.
  discord_webhook: ""

metrics:
  # Prometheus-style metrics on a localhost HTTP endpoint.
  # Try: curl http://127.0.0.1:9101/metrics
  enabled: true
  host: "127.0.0.1"
  port: 9101

database:
  # CRITICAL - SQLite history + remote hash manifest (used by "backup-mgr check").
  file: "./history.db"

pterodactyl:
  # Before compressing a live server, send a console command (e.g. "save-all")
  # through the Pterodactyl CLIENT API websocket to flush data to disk.
  enabled: false
  panel_url: "https://panel.example.com"
  api_key: ""                   # CRITICAL - Pterodactyl CLIENT API key
  server_id: ""                 # server UUID shown in the panel URL
  pre_backup_command: "save-all"
  pre_backup_delay_seconds: 10
  fail_on_error: false

run:
  continue_after_manual_resume: false
  check_state_seconds: 30

timezone: "Asia/Kolkata"
